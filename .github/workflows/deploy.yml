name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region ${{ secrets.AWS_REGION || 'luxembourg-2' }}

      - name: Sync to S3-compatible storage
        env:
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL || 'https://luxembourg-2.storage.gcore.dev' }}
          AWS_MAX_CONCURRENT_REQUESTS: 50
        run: |
          aws s3 cp dist/ s3://westack-it-eu/ \
            --recursive \
            --endpoint-url "$AWS_ENDPOINT_URL"

  deploy-fastedge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build FastEdge WASM binaries
        run: |
          for file in github request-demo; do
            npx fastedge-build --input "edge/${file}.js" --output "edge/${file}.wasm"
          done

      - name: Upload WASM binaries to Gcore
        id: upload
        env:
          GCORE_API_KEY: ${{ secrets.GCORE_API_KEY }}
        run: |
          for file in github request-demo; do
            echo "Uploading edge/${file}.wasm..."
            RESPONSE=$(curl --fail --silent --show-error \
              -X POST 'https://api.gcore.com/fastedge/v1/binaries/raw' \
              -H "Authorization: APIKey $GCORE_API_KEY" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@./edge/${file}.wasm")
            BINARY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "BINARY_ID_${file}=${BINARY_ID}" >> "$GITHUB_OUTPUT"
            echo "  $file → binary ID $BINARY_ID"
          done

      - name: Update FastEdge apps
        env:
          GCORE_API_KEY: ${{ secrets.GCORE_API_KEY }}
          # github.wasm handles both auth and callback via URL routing
          FASTEDGE_APP_AUTH: ${{ secrets.FASTEDGE_APP_AUTH }}
          FASTEDGE_APP_CALLBACK: ${{ secrets.FASTEDGE_APP_CALLBACK }}
          FASTEDGE_APP_REQUEST_DEMO: ${{ secrets.FASTEDGE_APP_REQUEST_DEMO }}
          BINARY_ID_GITHUB: ${{ steps.upload.outputs.BINARY_ID_github }}
          BINARY_ID_REQUEST_DEMO: ${{ steps.upload.outputs['BINARY_ID_request-demo'] }}
        run: |
          # github.wasm serves both auth and callback — point both apps to it
          if [ -n "$FASTEDGE_APP_AUTH" ]; then
            echo "Updating app $app_id_env → binary $BINARY_ID_GITHUB..."
            curl --fail --silent --show-error \
              -X PUT "https://api.gcore.com/fastedge/v1/apps/$FASTEDGE_APP_AUTH" \
              -H "Authorization: APIKey $GCORE_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"binary\": $BINARY_ID_GITHUB, \"status\": 1}"
            echo "  Done."
          fi

          # request-demo app
          if [ -n "$FASTEDGE_APP_REQUEST_DEMO" ]; then
            echo "Updating app $FASTEDGE_APP_REQUEST_DEMO → binary $BINARY_ID_REQUEST_DEMO..."
            curl --fail --silent --show-error \
              -X PUT "https://api.gcore.com/fastedge/v1/apps/$FASTEDGE_APP_REQUEST_DEMO" \
              -H "Authorization: APIKey $GCORE_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"binary\": $BINARY_ID_REQUEST_DEMO, \"status\": 1}"
            echo "  Done."
          fi
