name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region ${{ secrets.AWS_REGION || 'luxembourg-2' }}

      - name: Sync to S3-compatible storage
        env:
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL || 'https://luxembourg-2.storage.gcore.dev' }}
          AWS_MAX_CONCURRENT_REQUESTS: 50
        run: |
          aws s3 cp dist/ s3://westack-it-eu/ \
            --recursive \
            --endpoint-url "$AWS_ENDPOINT_URL"

  deploy-fastedge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Astro site (required for static assets in WASM)
        run: npm run build

      - name: Build FastEdge combined WASM
        run: npm run fe:build

      - name: Upload WASM binary to Gcore
        id: upload
        env:
          GCORE_API_KEY: ${{ secrets.GCORE_API_KEY }}
        run: |
          echo "Uploading .fastedge/fastedge.wasm..."
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST 'https://api.gcore.com/fastedge/v1/binaries/raw' \
            -H "Authorization: APIKey $GCORE_API_KEY" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@./.fastedge/fastedge.wasm")
          BINARY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "BINARY_ID=${BINARY_ID}" >> "$GITHUB_OUTPUT"
          echo "  Uploaded → binary ID $BINARY_ID"

      - name: Update FastEdge app
        env:
          GCORE_API_KEY: ${{ secrets.GCORE_API_KEY }}
          FASTEDGE_APP_ID: '2811'
          BINARY_ID: ${{ steps.upload.outputs.BINARY_ID }}
        run: |
          echo "Updating app $FASTEDGE_APP_ID → binary $BINARY_ID..."
          curl --fail --silent --show-error \
            -X PUT "https://api.gcore.com/fastedge/v1/apps/$FASTEDGE_APP_ID" \
            -H "Authorization: APIKey $GCORE_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"binary\": $BINARY_ID, \"status\": 1}"
          echo "  Done."
